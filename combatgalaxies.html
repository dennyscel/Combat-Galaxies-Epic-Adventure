<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Galaxies - Epic Adventure</title>
    <!--
        Jogo: Combat Galaxies
        Versão: 1.0
        Desenvolvido por: Dennys Smaniotto Pavanelli
        Data: 31/05/2025
        Observação: Você pode usar e modificar este código livremente, desde que dê os devidos créditos ao criador, Dennys Smaniotto Pavanelli.
    -->
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', 'Courier New', monospace;
            color: #fff;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
            background: #000022;
        }
        .hud {
            position: absolute;
            top: 1vh;
            left: 1vw;
            z-index: 5;
            pointer-events: none;
            display: none;
        }
        .hud-item {
            font-size: 2vw;
            margin-bottom: 0.5vh;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .health-bar {
            width: 10vw;
            height: 1.2vh;
            background: #333;
            border: 2px solid #fff;
            border-radius: 5px;
            margin-top: 0.5vh;
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #00ff00, #00cc00);
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        #startScreen, #gameOverScreen, #waveScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2vw;
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            text-align: center;
            display: none;
            width: 80vw;
            max-width: 400px;
        }
        #startScreen h2, #gameOverScreen h2, #waveScreen h2 {
            margin: 0 0 1.5vh;
            color: #00ff88;
            text-shadow: 0 0 5px #00ff88;
            font-size: 5vw;
        }
        #startScreen button, #gameOverScreen button, #waveScreen button {
            padding: 1vh 2vw;
            font-size: 3vw;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0.5vh;
            transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        #gameOverScreen button.shop-button {
            background: linear-gradient(135deg, #ff8800, #cc6600);
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #shop {
            display: none;
            margin-top: 1.5vh;
            max-height: 60vh;
            overflow-y: auto;
        }
        #shop h3 {
            color: #00ff88;
            font-size: 4vw;
            margin: 1vh 0;
        }
        .shop-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5vh;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 0.5vh 0;
        }
        .shop-item canvas {
            margin-right: 1vw;
        }
        .shop-item button {
            padding: 0.5vh 1vw;
            font-size: 2.5vw;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 600px) {
            .hud-item {
                font-size: 3vw;
            }
            .health-bar {
                width: 15vw;
            }
            #startScreen h2, #gameOverScreen h2, #waveScreen h2 {
                font-size: 6vw;
            }
            #startScreen button, #gameOverScreen button, #waveScreen button {
                font-size: 4vw;
                padding: 1.5vh 3vw;
            }
            #shop h3 {
                font-size: 5vw;
            }
            .shop-item button {
                font-size: 3.5vw;
                padding: 1vh 2vw;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="startScreen">
        <h2>Combat Galaxies</h2>
        <button id="startButton">Start Game</button>
    </div>
    <div id="gameOverScreen">
        <h2>Game Over</h2>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Wave: <span id="finalWave">1</span></p>
        <p>Gold: <span id="finalGold">0</span></p>
        <button id="continueButton">Continue</button>
        <button id="resetButton">Reset</button>
        <button id="shopButton" class="shop-button">Open Shop</button>
        <div id="shop" style="display:none;">
            <p>Gold: <span id="shopGold">0</span></p>
            <h3>Ships</h3>
            <div class="shop-item"><canvas id="scoutIcon" width="20" height="20"></canvas><button id="buyScout">Scout (200)</button></div>
            <div class="shop-item"><canvas id="strikerIcon" width="20" height="20"></canvas><button id="buyStriker">Striker (500)</button></div>
            <div class="shop-item"><canvas id="titanIcon" width="20" height="20"></canvas><button id="buyTitan">Titan (1200)</button></div>
            <h3>Upgrades</h3>
            <div class="shop-item"><canvas id="healthIcon" width="20" height="20"></canvas><button id="healthUpgrade">Health +20 (50)</button></div>
            <div class="shop-item"><canvas id="fireRateIcon" width="20" height="20"></canvas><button id="fireRateUpgrade">Fire Rate (75)</button></div>
            <div class="shop-item"><canvas id="speedIcon" width="20" height="20"></canvas><button id="speedUpgrade">Speed +0.05 (100)</button></div>
            <button id="closeShop">Close</button>
        </div>
    </div>
    <div id="waveScreen">
        <h2>Wave <span id="waveNumber">1</span></h2>
    </div>
    <div class="hud">
        <div class="hud-item">Score: <span id="scoreDisplay">0</span></div>
        <div class="hud-item">Wave: <span id="waveDisplay">1</span></div>
        <div class="hud-item">Gold: <span id="goldDisplay">0</span></div>
        <div class="hud-item">Health: <span id="healthValue">100/100</span>
            <div class="health-bar"><div id="healthBar" class="health-fill" style="width: 100%"></div></div>
        </div>
    </div>

    <script>
        class StarField {
            constructor(game) { this.game = game; this.stars = []; this.initStars(); }
            initStars() {
                this.stars = [];
                for (let i = 0; i < 50; i++) {
                    this.stars.push({ x: Math.random() * this.game.canvas.width, y: Math.random() * this.game.canvas.height, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.5 + 0.2 });
                }
            }
            update() { this.stars.forEach(star => { star.y += star.speed; if (star.y > this.game.canvas.height) { star.y = -10; star.x = Math.random() * this.game.canvas.width; } }); }
            render(ctx) {
                ctx.fillStyle = '#000011';
                ctx.fillRect(0, 0, this.game.canvas.width, this.game.canvas.height);
                ctx.fillStyle = '#ffffff';
                this.stars.forEach(star => { ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill(); });
            }
        }

        class Particle { constructor(x, y) { this.x = x; this.y = y; this.size = Math.random() * 5 + 2; this.vx = (Math.random() - 0.5) * 5; this.vy = (Math.random() - 0.5) * 5; this.life = 20; } update() { this.x += this.vx; this.y += this.vy; this.life--; } render(ctx) { ctx.fillStyle = `rgba(255, 165, 0, ${this.life / 20})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } }

        class Bullet {
            constructor(game, x, y, isBossBullet = false, angle = 0, speed = 3, targetX = null, targetY = null) {
                this.game = game;
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 10;
                this.speed = isBossBullet ? speed : 10;
                this.angle = angle;
                if (targetX !== null && targetY !== null) {
                    const dx = targetX - x;
                    const dy = targetY - y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    this.vx = (dx / distance) * this.speed;
                    this.vy = (dy / distance) * this.speed;
                } else {
                    this.vx = Math.sin(angle) * this.speed;
                    this.vy = Math.cos(angle) * (isBossBullet ? this.speed : -10);
                }
                this.alive = true;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.y < -this.height || this.y > this.game.canvas.height || this.x < -this.width || this.x > this.game.canvas.width) this.alive = false;
            }
            render(ctx) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        class PowerUp { constructor(game, x, y, type) { this.game = game; this.x = x; this.y = y; this.width = 15; this.height = 15; this.type = type; this.vy = 2; this.alive = true; } update() { this.y += this.vy; if (this.y > this.game.canvas.height) this.alive = false; } render(ctx) { ctx.fillStyle = this.type === 'health' ? '#00ff00' : '#ffff00'; ctx.fillRect(this.x, this.y, this.width, this.height); } }

        class Enemy {
            constructor(game, x, y, type) {
                this.game = game;
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = type === 'fast' ? 15 : (type.includes('boss') ? 40 : 20);
                this.height = type === 'fast' ? 15 : (type.includes('boss') ? 40 : 20);
                this.health = type.includes('boss') ? (type === 'boss1' ? 10 : (type === 'boss2' ? 15 : 20)) : (type === 'fast' ? 1 : 2);
                this.vy = type.includes('boss') ? 1 : (type === 'fast' ? 4 : 2);
                this.vx = 0;
                this.alive = true;
                this.shootCooldown = type === 'boss1' ? 60 : (type === 'boss2' ? 45 : 30);
                this.movePattern = 0;
                this.attackPattern = 0;
            }
            update() {
                if (this.type.includes('boss')) {
                    this.bossAI();
                    if (this.shootCooldown <= 0) {
                        this.shoot();
                        this.shootCooldown = this.type === 'boss1' ? 60 : (this.type === 'boss2' ? 45 : 30);
                    } else {
                        this.shootCooldown--;
                    }
                } else {
                    this.y += this.vy * this.game.waveSpeedMultiplier;
                    this.x += this.vx;
                    if (this.y > this.game.canvas.height) this.alive = false;
                }
                if (this.y > this.game.canvas.height && this.type.includes('boss')) this.y = -this.height;
            }
            bossAI() {
                const playerX = this.game.ship.x + this.game.ship.width / 2;
                const playerY = this.game.ship.y + this.game.ship.height / 2;

                if (this.type === 'boss1') {
                    // Movimento ziguezague lento
                    this.movePattern = (this.movePattern + 0.05) % (Math.PI * 2);
                    this.vx = Math.sin(this.movePattern) * 2;
                    this.y += this.vy;
                } else if (this.type === 'boss2') {
                    // Movimento orbital
                    const centerX = this.game.canvas.width / 2;
                    const centerY = this.game.canvas.height / 3;
                    this.movePattern += 0.03;
                    this.x = centerX + Math.cos(this.movePattern) * 100;
                    this.y = centerY + Math.sin(this.movePattern) * 50;
                } else if (this.type === 'boss3') {
                    // Movimento caótico
                    const dx = playerX - (this.x + this.width / 2);
                    const dy = playerY - (this.y + this.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    this.movePattern += 0.1;
                    this.vx = (dx / distance) * 2 + Math.sin(this.movePattern) * 2;
                    this.vy = (dy / distance) * 2 + Math.cos(this.movePattern) * 1;
                    this.x += this.vx;
                    this.y += this.vy;
                }

                this.x = Math.max(0, Math.min(this.game.canvas.width - this.width, this.x));
                this.y = Math.max(0, Math.min(this.game.canvas.height - this.height, this.y));
            }
            shoot() {
                if (this.type === 'boss1') {
                    // Disparos em linha reta
                    const bullet = new Bullet(this.game, this.x + this.width / 2 - 2, this.y + this.height, true, 0);
                    this.game.bossBullets.push(bullet);
                } else if (this.type === 'boss2') {
                    // Disparos em leque
                    for (let i = -22.5; i <= 22.5; i += 22.5) {
                        const angle = i * Math.PI / 180;
                        const bullet = new Bullet(this.game, this.x + this.width / 2 - 2, this.y + this.height, true, angle);
                        this.game.bossBullets.push(bullet);
                    }
                } else if (this.type === 'boss3') {
                    // Disparos em espiral + teleguiados
                    this.attackPattern += 0.2;
                    for (let i = 0; i < 360; i += 45) {
                        const angle = (i + this.attackPattern) * Math.PI / 180;
                        const bullet = new Bullet(this.game, this.x + this.width / 2 - 2, this.y + this.height, true, angle, 4);
                        this.game.bossBullets.push(bullet);
                    }
                    if (Math.random() < 0.3) {
                        const bullet = new Bullet(this.game, this.x + this.width / 2 - 2, this.y + this.height, true, 0, 5, this.game.ship.x + this.game.ship.width / 2, this.game.ship.y + this.game.ship.height / 2);
                        this.game.bossBullets.push(bullet);
                    }
                }
            }
            takeDamage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.alive = false;
                    this.game.playSound('explosion');
                    const points = this.type.includes('boss') ? 100 : (this.type === 'fast' ? 15 : 10);
                    const gold = this.type.includes('boss') ? 100 : (this.type === 'fast' ? 15 : 10);
                    this.game.score += points;
                    this.game.gold += gold;
                    for (let i = 0; i < (this.type.includes('boss') ? 20 : 10); i++) {
                        this.game.particles.push(new Particle(this.x + this.width / 2, this.y + this.height / 2));
                    }
                    if (Math.random() < 0.2 && !this.type.includes('boss')) {
                        const type = Math.random() < 0.5 ? 'health' : 'fireRate';
                        this.game.powerUps.push(new PowerUp(this.game, this.x, this.y, type));
                    }
                }
            }
            render(ctx) {
                ctx.fillStyle = this.type === 'fast' ? '#ffaa00' : (this.type.includes('boss') ? '#ff0000' : '#ff5555');
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        class Ship {
            constructor(game, x, y, type = 'Scout') {
                this.game = game;
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.type = type;
                this.setStats();
                this.shootCooldown = 0;
                this.fireRateBoostTimer = 0;
                this.targetX = this.x;
                this.targetY = this.y;
            }
            setStats() {
                const stats = {
                    'Scout': { maxHealth: this.game.upgradeMaxHealth || 100, maxUpgrade: 150, speed: this.game.upgradeSpeed || 0.2, baseShootCooldown: this.game.upgradeBaseShootCooldown || 8 },
                    'Striker': { maxHealth: this.game.upgradeMaxHealth || 150, maxUpgrade: 250, speed: this.game.upgradeSpeed || 0.3, baseShootCooldown: this.game.upgradeBaseShootCooldown || 6 },
                    'Titan': { maxHealth: this.game.upgradeMaxHealth || 200, maxUpgrade: 400, speed: this.game.upgradeSpeed || 0.15, baseShootCooldown: this.game.upgradeBaseShootCooldown || 10 }
                };
                const stat = stats[this.type] || stats['Scout'];
                this.maxHealth = Math.min(stat.maxHealth, stat.maxUpgrade);
                this.health = this.maxHealth;
                this.speed = stat.speed;
                this.baseShootCooldown = stat.baseShootCooldown;
            }
            update() {
                if (this.game.isMobile && this.game.touch.active) {
                    this.targetX = this.game.touch.x - this.width / 2;
                    this.targetY = this.game.touch.y - this.height / 2;
                } else if (!this.game.isMobile) {
                    let vx = 0, vy = 0;
                    const speed = 6;
                    if (this.game.keys['ArrowLeft'] || this.game.keys['a']) vx = -speed;
                    if (this.game.keys['ArrowRight'] || this.game.keys['d']) vx = speed;
                    if (this.game.keys['ArrowUp'] || this.game.keys['w']) vy = -speed;
                    if (this.game.keys['ArrowDown'] || this.game.keys['s']) vy = speed;
                    this.targetX = this.x + vx;
                    this.targetY = this.y + vy;
                }
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                this.x = Math.max(0, Math.min(this.game.canvas.width - this.width, this.x));
                this.y = Math.max(0, Math.min(this.game.canvas.height - this.height, this.y));
                if (this.fireRateBoostTimer > 0) {
                    this.fireRateBoostTimer--;
                    if (this.fireRateBoostTimer === 0) this.baseShootCooldown = this.game.upgradeBaseShootCooldown || 8;
                }
                if (this.shootCooldown > 0) this.shootCooldown--;
                const shooting = this.game.keys[' '] || this.game.mouse.pressed || (this.game.isMobile && this.game.touch.active);
                if (shooting && this.shootCooldown === 0) {
                    this.shoot();
                    this.shootCooldown = this.baseShootCooldown;
                    this.game.playSound('shoot');
                }
            }
            shoot() {
                const bullet = new Bullet(this.game, this.x + this.width / 2 - 2, this.y);
                this.game.bullets.push(bullet);
            }
            takeDamage(amount) {
                this.health -= amount;
                this.game.playSound('hit');
                this.game.startScreenShake();
                if (this.health <= 0) {
                    this.health = 0;
                    this.game.gameOver();
                }
            }
            applyPowerUp(type) {
                this.game.playSound('powerUp');
                if (type === 'health') this.health = Math.min(this.health + 20, this.maxHealth);
                else if (type === 'fireRate') {
                    this.baseShootCooldown = 4;
                    this.fireRateBoostTimer = 300;
                }
            }
            render(ctx) {
                ctx.fillStyle = this.type === 'Scout' ? '#00ff88' : (this.type === 'Striker' ? '#ffaa00' : '#ff0000');
                ctx.strokeStyle = '#00cc66';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x + this.width / 4, this.y + this.height);
                ctx.lineTo(this.x + this.width * 3 / 4, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 3, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                if (!this.canvas) { console.error("Canvas element not found!"); return; }
                this.ctx = this.canvas.getContext('2d');
                if (!this.ctx) { console.error("2D context not supported!"); return; }
                this.canvas.style.display = 'block';
                this.resizeCanvas();
                this.state = 'start';
                this.keys = {};
                this.mouse = { x: this.canvas.width / 2, y: this.canvas.height / 2, pressed: false };
                this.touch = { x: this.canvas.width / 2, y: this.canvas.height / 2, active: false, id: null };
                this.isMobile = /Mobi|Android/i.test(navigator.userAgent);
                this.starField = new StarField(this);
                this.ship = new Ship(this, this.canvas.width / 2 - 15, this.canvas.height - 80);
                this.bullets = [];
                this.bossBullets = [];
                this.enemies = [];
                this.powerUps = [];
                this.particles = [];
                this.score = 0;
                this.gold = 0;
                this.wave = 1;
                this.waveSpeedMultiplier = 1;
                this.enemySpawnTimer = 0;
                this.enemySpawnInterval = 60;
                this.screenShake = 0;
                this.bossActive = false;
                this.bossTimer = 0;

                this.upgradeMaxHealth = 100;
                this.upgradeBaseShootCooldown = 8;
                this.upgradeSpeed = 0.2;

                this.initializeDOMElements();

                this.sounds = {
                    shoot: new Audio('https://www.myinstants.com/media/sounds/laser.mp3'),
                    hit: new Audio('https://www.myinstants.com/media/sounds/hit.mp3'),
                    explosion: new Audio('https://www.myinstants.com/media/sounds/explosion.mp3'),
                    powerUp: new Audio('https://www.myinstants.com/media/sounds/powerup.mp3')
                };
                window.addEventListener('resize', () => this.resizeCanvas());
                this.setupInput();
                this.setupShop();
                this.drawIcons();
                document.getElementById('startButton').addEventListener('click', () => this.startGame());
                document.getElementById('continueButton').addEventListener('click', () => this.continueGame());
                document.getElementById('resetButton').addEventListener('click', () => this.restartGame());
                if (document.getElementById('startScreen')) {
                    document.getElementById('startScreen').style.display = 'block';
                }
            }
            initializeDOMElements() {
                this.scoreDisplay = document.getElementById('scoreDisplay');
                this.goldDisplay = document.getElementById('goldDisplay');
                this.waveDisplay = document.getElementById('waveDisplay');
                this.healthValue = document.getElementById('healthValue');
                this.healthBar = document.getElementById('healthBar');
                this.finalScore = document.getElementById('finalScore');
                this.finalWave = document.getElementById('finalWave');
                this.finalGold = document.getElementById('finalGold');
                this.waveNumber = document.getElementById('waveNumber');

                if (!this.healthBar) console.error("healthBar element not found!");
                if (!this.scoreDisplay) console.error("scoreDisplay element not found!");
                if (!this.goldDisplay) console.error("goldDisplay element not found!");
                if (!this.waveDisplay) console.error("waveDisplay element not found!");
                if (!this.healthValue) console.error("healthValue element not found!");
                if (!this.finalScore) console.error("finalScore element not found!");
                if (!this.finalWave) console.error("finalWave element not found!");
                if (!this.finalGold) console.error("finalGold element not found!");
                if (!this.waveNumber) console.error("waveNumber element not found!");
            }
            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                if (this.starField) this.starField.initStars();
                this.drawIcons();
            }
            setupInput() {
                window.addEventListener('keydown', e => this.keys[e.key] = true);
                window.addEventListener('keyup', e => this.keys[e.key] = false);
                this.canvas.addEventListener('mousemove', e => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                });
                this.canvas.addEventListener('mousedown', () => this.mouse.pressed = true);
                this.canvas.addEventListener('mouseup', () => this.mouse.pressed = false);
                this.canvas.addEventListener('touchstart', e => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    for (let touch of e.changedTouches) {
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;
                        this.touch.x = x;
                        this.touch.y = y;
                        this.touch.active = true;
                        this.touch.id = touch.identifier;
                    }
                });
                this.canvas.addEventListener('touchmove', e => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    for (let touch of e.changedTouches) {
                        const x = touch.clientX - rect.left;
                        const y = touch.clientY - rect.top;
                        if (touch.identifier === this.touch.id) {
                            this.touch.x = x;
                            this.touch.y = y;
                        }
                    }
                });
                this.canvas.addEventListener('touchend', e => {
                    e.preventDefault();
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === this.touch.id) {
                            this.touch.active = false;
                            this.touch.id = null;
                        }
                    }
                });
            }
            setupShop() {
                const shopButton = document.getElementById('shopButton');
                if (shopButton) {
                    shopButton.addEventListener('click', () => {
                        const shop = document.getElementById('shop');
                        if (shop) {
                            shop.style.display = 'block';
                            this.updateShop();
                        }
                    });
                }
                const closeShop = document.getElementById('closeShop');
                if (closeShop) {
                    closeShop.addEventListener('click', () => {
                        const shop = document.getElementById('shop');
                        if (shop) shop.style.display = 'none';
                    });
                }
                const healthUpgrade = document.getElementById('healthUpgrade');
                if (healthUpgrade) healthUpgrade.addEventListener('click', () => this.buyUpgrade('health'));
                const fireRateUpgrade = document.getElementById('fireRateUpgrade');
                if (fireRateUpgrade) fireRateUpgrade.addEventListener('click', () => this.buyUpgrade('fireRate'));
                const speedUpgrade = document.getElementById('speedUpgrade');
                if (speedUpgrade) speedUpgrade.addEventListener('click', () => this.buyUpgrade('speed'));
                const buyScout = document.getElementById('buyScout');
                if (buyScout) buyScout.addEventListener('click', () => this.buyShip('Scout', 200));
                const buyStriker = document.getElementById('buyStriker');
                if (buyStriker) buyStriker.addEventListener('click', () => this.buyShip('Striker', 500));
                const buyTitan = document.getElementById('buyTitan');
                if (buyTitan) buyTitan.addEventListener('click', () => this.buyShip('Titan', 1200));
            }
            drawIcons() {
                const healthCtx = document.getElementById('healthIcon')?.getContext('2d');
                if (healthCtx) {
                    healthCtx.clearRect(0, 0, 20, 20);
                    healthCtx.fillStyle = '#00ff00';
                    healthCtx.beginPath();
                    healthCtx.moveTo(5, 10);
                    healthCtx.lineTo(10, 2);
                    healthCtx.lineTo(15, 10);
                    healthCtx.lineTo(10, 15);
                    healthCtx.closePath();
                    healthCtx.fill();
                }
                const fireRateCtx = document.getElementById('fireRateIcon')?.getContext('2d');
                if (fireRateCtx) {
                    fireRateCtx.clearRect(0, 0, 20, 20);
                    fireRateCtx.fillStyle = '#ffff00';
                    fireRateCtx.beginPath();
                    fireRateCtx.moveTo(10, 2);
                    fireRateCtx.lineTo(15, 15);
                    fireRateCtx.lineTo(5, 15);
                    fireRateCtx.closePath();
                    fireRateCtx.fill();
                }
                const speedCtx = document.getElementById('speedIcon')?.getContext('2d');
                if (speedCtx) {
                    speedCtx.clearRect(0, 0, 20, 20);
                    speedCtx.fillStyle = '#00ffff';
                    speedCtx.beginPath();
                    speedCtx.moveTo(5, 10);
                    speedCtx.lineTo(15, 5);
                    speedCtx.lineTo(15, 15);
                    speedCtx.closePath();
                    speedCtx.fill();
                }
                const scoutCtx = document.getElementById('scoutIcon')?.getContext('2d');
                if (scoutCtx) {
                    scoutCtx.clearRect(0, 0, 20, 20);
                    scoutCtx.fillStyle = '#00ff88';
                    scoutCtx.fillRect(5, 5, 10, 10);
                }
                const strikerCtx = document.getElementById('strikerIcon')?.getContext('2d');
                if (strikerCtx) {
                    strikerCtx.clearRect(0, 0, 20, 20);
                    strikerCtx.fillStyle = '#ffaa00';
                    strikerCtx.fillRect(5, 5, 10, 10);
                }
                const titanCtx = document.getElementById('titanIcon')?.getContext('2d');
                if (titanCtx) {
                    titanCtx.clearRect(0, 0, 20, 20);
                    titanCtx.fillStyle = '#ff0000';
                    titanCtx.fillRect(5, 5, 10, 10);
                }
            }
            buyUpgrade(type) {
                const costs = { health: 50, fireRate: 75, speed: 100 };
                if (this.gold >= costs[type]) {
                    this.gold -= costs[type];
                    if (type === 'health') {
                        const maxUpgrade = { 'Scout': 150, 'Striker': 250, 'Titan': 400 }[this.ship.type] || 150;
                        this.upgradeMaxHealth = Math.min(this.upgradeMaxHealth + 20, maxUpgrade);
                        this.ship.maxHealth = this.upgradeMaxHealth;
                        this.ship.health = this.upgradeMaxHealth;
                    } else if (type === 'fireRate') {
                        this.upgradeBaseShootCooldown = Math.max(2, this.upgradeBaseShootCooldown - 1);
                        this.ship.baseShootCooldown = this.upgradeBaseShootCooldown;
                    } else if (type === 'speed') {
                        this.upgradeSpeed += 0.05;
                        this.ship.speed = this.upgradeSpeed;
                    }
                    this.updateShop();
                    this.updateHUD();
                }
            }
            buyShip(type, cost) {
                if (this.gold >= cost) {
                    this.gold -= cost;
                    this.upgradeMaxHealth = { 'Scout': 100, 'Striker': 150, 'Titan': 200 }[type] || 100;
                    this.upgradeBaseShootCooldown = 8;
                    this.upgradeSpeed = 0.2;
                    this.ship = new Ship(this, this.canvas.width / 2 - 15, this.canvas.height - 80, type);
                    this.updateShop();
                    this.updateHUD();
                }
            }
            updateShop() {
                const shopGold = document.getElementById('shopGold');
                if (shopGold) shopGold.textContent = this.gold;
                const costs = { health: 50, fireRate: 75, speed: 100 };
                const healthUpgrade = document.getElementById('healthUpgrade');
                const fireRateUpgrade = document.getElementById('fireRateUpgrade');
                const speedUpgrade = document.getElementById('speedUpgrade');
                const buyScout = document.getElementById('buyScout');
                const buyStriker = document.getElementById('buyStriker');
                const buyTitan = document.getElementById('buyTitan');
                if (healthUpgrade) healthUpgrade.disabled = this.gold < costs.health;
                if (fireRateUpgrade) fireRateUpgrade.disabled = this.gold < costs.fireRate;
                if (speedUpgrade) speedUpgrade.disabled = this.gold < costs.speed;
                if (buyScout) buyScout.disabled = this.gold < 200 || this.ship.type === 'Scout';
                if (buyStriker) buyStriker.disabled = this.gold < 500 || this.wave < 5 || this.ship.type === 'Striker';
                if (buyTitan) buyTitan.disabled = this.gold < 1200 || this.wave < 10 || this.ship.type === 'Titan';
            }
            playSound(sound) {
                if (this.sounds[sound]) {
                    this.sounds[sound].currentTime = 0;
                    this.sounds[sound].play().catch(error => console.log("Sound play error:", error));
                }
            }
            startScreenShake() {
                this.screenShake = this.bossActive ? 20 : 10;
            }
            spawnEnemy() {
                const x = Math.random() * (this.canvas.width - 20);
                if (this.wave % 5 === 0 && !this.bossActive) {
                    this.bossActive = true;
                    this.bossTimer = 1800;
                    const bossType = this.wave === 5 ? 'boss1' : (this.wave === 10 ? 'boss2' : 'boss3');
                    const boss = new Enemy(this, this.canvas.width / 2 - 20, -40, bossType);
                    this.enemies.push(boss);
                } else if (!this.bossActive) {
                    const type = Math.random() < 0.3 ? 'fast' : 'basic';
                    const enemy = new Enemy(this, x, -20, type);
                    this.enemies.push(enemy);
                }
            }
            advanceWave() {
                this.wave++;
                this.waveSpeedMultiplier += 0.2;
                this.enemySpawnInterval = Math.max(20, this.enemySpawnInterval - 5);
                this.bossActive = false;
                this.bossTimer = 0;
                if (this.waveDisplay) this.waveDisplay.textContent = this.wave;
                if (this.waveNumber) this.waveNumber.textContent = this.wave;
                const waveScreen = document.getElementById('waveScreen');
                if (waveScreen) {
                    waveScreen.style.display = 'block';
                    setTimeout(() => {
                        if (waveScreen) waveScreen.style.display = 'none';
                    }, 1500);
                }
            }
            checkCollisions() {
                this.bullets.forEach(bullet => {
                    if (!bullet.alive) return;
                    this.enemies.forEach(enemy => {
                        if (!enemy.alive) return;
                        if (
                            bullet.x < enemy.x + enemy.width &&
                            bullet.x + bullet.width > enemy.x &&
                            bullet.y < enemy.y + enemy.height &&
                            bullet.y + bullet.height > enemy.y
                        ) {
                            bullet.alive = false;
                            enemy.takeDamage(1);
                            if (!enemy.alive && enemy.type.includes('boss')) this.advanceWave();
                        }
                    });
                    this.bossBullets.forEach(bossBullet => {
                        if (!bossBullet.alive) return;
                        if (
                            bullet.x < bossBullet.x + bossBullet.width &&
                            bullet.x + bullet.width > bossBullet.x &&
                            bullet.y < bossBullet.y + bossBullet.height &&
                            bullet.y + bullet.height > bossBullet.y
                        ) {
                            bullet.alive = false;
                            bossBullet.alive = false;
                        }
                    });
                });

                this.bossBullets.forEach(bullet => {
                    if (!bullet.alive) return;
                    if (
                        this.ship.x < bullet.x + bullet.width &&
                        this.ship.x + this.ship.width > bullet.x &&
                        this.ship.y < bullet.y + bullet.height &&
                        this.ship.y + this.ship.height > bullet.y
                    ) {
                        bullet.alive = false;
                        this.ship.takeDamage(10);
                    }
                });

                this.enemies.forEach(enemy => {
                    if (!enemy.alive) return;
                    if (
                        this.ship.x < enemy.x + enemy.width &&
                        this.ship.x + this.ship.width > enemy.x &&
                        this.ship.y < enemy.y + enemy.height &&
                        this.ship.y + this.ship.height > enemy.y
                    ) {
                        enemy.alive = false;
                        this.ship.takeDamage(15);
                        for (let i = 0; i < 5; i++) {
                            this.particles.push(new Particle(enemy.x + enemy.width / 2, enemy.y + this.height / 2));
                        }
                    }
                });

                this.powerUps.forEach(powerUp => {
                    if (!powerUp.alive) return;
                    if (
                        this.ship.x < powerUp.x + powerUp.width &&
                        this.ship.x + this.ship.width > powerUp.x &&
                        this.ship.y < powerUp.y + powerUp.height &&
                        this.ship.y + this.ship.height > powerUp.y
                    ) {
                        powerUp.alive = false;
                        this.ship.applyPowerUp(powerUp.type);
                    }
                });

                this.bullets = this.bullets.filter(bullet => bullet.alive);
                this.bossBullets = this.bossBullets.filter(bullet => bullet.alive);
                this.enemies = this.enemies.filter(enemy => enemy.alive);
                this.powerUps = this.powerUps.filter(powerUp => powerUp.alive);
                this.particles = this.particles.filter(particle => particle.life > 0);
            }
            startGame() {
                this.state = 'playing';
                const startScreen = document.getElementById('startScreen');
                const hud = document.querySelector('.hud');
                if (startScreen) startScreen.style.display = 'none';
                if (hud) hud.style.display = 'block';
                this.initializeDOMElements();
                this.updateHUD();
                this.gameLoop();
            }
            continueGame() {
                this.state = 'playing';
                const gameOverScreen = document.getElementById('gameOverScreen');
                const hud = document.querySelector('.hud');
                if (gameOverScreen) gameOverScreen.style.display = 'none';
                if (hud) hud.style.display = 'block';
                this.ship = new Ship(this, this.canvas.width / 2 - 15, this.canvas.height - 80, this.ship.type);
                this.bullets = [];
                this.bossBullets = [];
                this.enemies = [];
                this.powerUps = [];
                this.particles = [];
                this.wave = 1;
                this.waveSpeedMultiplier = 1;
                this.enemySpawnTimer = 0;
                this.enemySpawnInterval = 60;
                this.screenShake = 0;
                this.bossActive = false;
                this.bossTimer = 0;
                this.initializeDOMElements();
                this.updateHUD();
                this.gameLoop();
            }
            restartGame() {
                this.state = 'playing';
                const gameOverScreen = document.getElementById('gameOverScreen');
                const hud = document.querySelector('.hud');
                if (gameOverScreen) gameOverScreen.style.display = 'none';
                if (hud) hud.style.display = 'block';
                this.upgradeMaxHealth = 100;
                this.upgradeBaseShootCooldown = 8;
                this.upgradeSpeed = 0.2;
                this.gold = 0;
                this.score = 0;
                this.ship = new Ship(this, this.canvas.width / 2 - 15, this.canvas.height - 80, 'Scout');
                this.bullets = [];
                this.bossBullets = [];
                this.enemies = [];
                this.powerUps = [];
                this.particles = [];
                this.wave = 1;
                this.waveSpeedMultiplier = 1;
                this.enemySpawnTimer = 0;
                this.enemySpawnInterval = 60;
                this.screenShake = 0;
                this.bossActive = false;
                this.bossTimer = 0;
                this.initializeDOMElements();
                this.updateHUD();
                this.gameLoop();
            }
            updateHUD() {
                if (this.scoreDisplay) this.scoreDisplay.textContent = this.score || 0;
                if (this.goldDisplay) this.goldDisplay.textContent = this.gold || 0;
                if (this.waveDisplay) this.waveDisplay.textContent = this.wave;
                const healthPercent = (this.ship.health / this.ship.maxHealth) * 100;
                if (this.healthBar) {
                    this.healthBar.style.width = healthPercent + '%';
                    if (healthPercent < 30) this.healthBar.style.background = '#ff0000';
                    else this.healthBar.style.background = 'linear-gradient(to right, #00ff00, #00cc00)';
                }
                if (this.healthValue) this.healthValue.textContent = `${Math.round(this.ship.health)}/${this.ship.maxHealth}`;
            }
            gameOver() {
                this.state = 'gameover';
                const gameOverScreen = document.getElementById('gameOverScreen');
                if (gameOverScreen) {
                    gameOverScreen.style.display = 'block';
                    if (this.finalScore) this.finalScore.textContent = this.score;
                    if (this.finalWave) this.finalWave.textContent = this.wave;
                    if (this.finalGold) this.finalGold.textContent = this.gold;
                    this.updateShop();
                }
            }
            gameLoop() {
                if (this.state !== 'playing') return;
                try {
                    let offsetX = 0, offsetY = 0;
                    if (this.screenShake > 0) {
                        offsetX = (Math.random() - 0.5) * (this.bossActive ? 15 : 10);
                        offsetY = (Math.random() - 0.5) * (this.bossActive ? 15 : 10);
                        this.screenShake--;
                    }

                    this.ctx.save();
                    this.ctx.translate(offsetX, offsetY);
                    this.ctx.clearRect(-offsetX, -offsetY, this.canvas.width, this.canvas.height);
                    this.starField.update();
                    this.starField.render(this.ctx);
                    this.ship.update();
                    this.ship.render(this.ctx);

                    this.bullets.forEach(bullet => { bullet.update(); bullet.render(this.ctx); });
                    this.bossBullets.forEach(bullet => { bullet.update(); bullet.render(this.ctx); });

                    this.powerUps.forEach(powerUp => { powerUp.update(); powerUp.render(this.ctx); });

                    this.enemySpawnTimer++;
                    if (this.enemySpawnTimer > this.enemySpawnInterval) {
                        this.spawnEnemy();
                        this.enemySpawnTimer = 0;
                    }

                    if (this.bossActive) {
                        this.bossTimer--;
                        if (this.bossTimer <= 0) {
                            this.bossActive = false;
                            this.enemies = this.enemies.filter(enemy => !enemy.type.includes('boss'));
                            this.advanceWave();
                        }
                    }

                    this.enemies.forEach(enemy => { enemy.update(); enemy.render(this.ctx); });

                    this.particles.forEach(particle => { particle.update(); particle.render(this.ctx); });

                    this.checkCollisions();

                    if (this.score >= this.wave * 100 && !this.bossActive) this.advanceWave();

                    this.updateHUD();
                    this.ctx.restore();

                    requestAnimationFrame(() => this.gameLoop());
                } catch (error) {
                    console.error("Game Loop Error:", error);
                }
            }
        }

        new Game();
    </script>
