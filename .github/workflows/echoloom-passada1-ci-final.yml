name: ECHOLOOM Passada 1 Final Isolated Verify

on:
  push:
    branches:
      - echoloom-passada1-ci-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "true"
      ECHOLOOM_CHROMIUM_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Reconstruct exact source payload
        shell: bash
        run: |
          set -euxo pipefail

          cat \
            payload/chunk-08-00 \
            payload/chunk-08-01 \
            payload/chunk-08-02 \
            payload/chunk-08-03 \
            payload/chunk-08-04 \
            payload/chunk-08-05 \
            payload/chunk-08-06 \
            payload/chunk-08-07 \
            payload/chunk-08-08 \
            payload/chunk-08-09 \
            payload/chunk-08-10 \
            payload/chunk-08-11 \
            payload/chunk-08-12 \
            payload/chunk-08-13 \
            payload/chunk-08-14 \
            payload/chunk-08-15 \
            > chunk08.actual

          cat \
            payload/chunk-00 \
            payload/chunk-01 \
            payload/chunk-02a \
            payload/chunk-02b \
            payload/chunk-03 \
            payload/chunk-04 \
            payload/chunk-05 \
            payload/chunk-06a \
            payload/chunk-06b1 \
            payload/chunk-06b2 \
            payload/chunk-06c \
            payload/chunk-06d \
            chunk08.actual \
            payload/chunk-10 \
            payload/chunk-12 \
            payload/chunk-14 \
            payload/chunk-16 \
            payload/chunk-18 \
            payload/chunk-20 \
            payload/chunk-22 \
            payload/chunk-24 \
            payload/chunk-26 \
            payload/chunk-28 \
            payload/chunk-30 \
            payload/chunk-32 \
            | tr -d '\r\n' \
            | base64 --decode \
            > echoloom-source.tar.xz

          echo "00adaa6d1093f16dcf7e2eacc0efa41708f476032094a3011e8f558026d70c76  echoloom-source.tar.xz" \
            | sha256sum --check --strict

          xz --test echoloom-source.tar.xz
          xz --decompress --stdout echoloom-source.tar.xz > echoloom-source.tar
          echo "3826fd38b65cbe58e94726e4d6a8de69f4b64b5a15bedbb6888a0fa44bc137a7  echoloom-source.tar" \
            | sha256sum --check --strict
          tar --list --file echoloom-source.tar >/dev/null
          mkdir project
          tar --extract --file echoloom-source.tar --directory project
          test -f project/package.json
          test -f project/package-lock.json
          test -f project/tests/release-critical-runtime-contracts.test.mjs

      - name: Setup Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Pin npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Record environment
        shell: bash
        run: |
          {
            uname -a
            node --version
            npm --version
            google-chrome --version || true
            sha256sum echoloom-source.tar.xz echoloom-source.tar
          } | tee ENVIRONMENT-CI.log

      - name: Clean npm ci
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../NPM-CI-CLEAN-PASSADA-1-CI.log

      - name: Full verify
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee ../VERIFY-CLEAN-PASSADA-1-CI.log

      - name: Package tested evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-artifacts
          cp -f ENVIRONMENT-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f NPM-CI-CLEAN-PASSADA-1-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f VERIFY-CLEAN-PASSADA-1-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f echoloom-source.tar.xz ci-artifacts/ECHOLOOM-SOURCE-TESTED-INPUT.tar.xz 2>/dev/null || true
          if [ -d project/release ]; then cp -a project/release ci-artifacts/release; fi
          if [ -d project/dist-static ]; then
            (cd project/dist-static && zip -X -q -r ../../ci-artifacts/ECHOLOOM-DIST-STATIC-CI.zip .)
          fi
          find ci-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > ci-artifacts/SHA256SUMS-CI.txt

      - name: Upload evidence and release outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoloom-passada1-final-ci-evidence
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 7
