name: ECHOLOOM Passada 1 Isolated Verify

on:
  push:
    branches:
      - echoloom-passada1-ci-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "true"
      ECHOLOOM_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euxo pipefail
          payload_files=(
            payload/chunk-00
            payload/chunk-01
            payload/chunk-02a
            payload/chunk-02b
            payload/chunk-03
            payload/chunk-04
            payload/chunk-05
            payload/chunk-06a
            payload/chunk-06b1
            payload/chunk-06b2
            payload/chunk-06c
            payload/chunk-06d
            payload/chunk-08
            payload/chunk-10
            payload/chunk-12
            payload/chunk-14
            payload/chunk-16
            payload/chunk-18
            payload/chunk-20
            payload/chunk-22
            payload/chunk-24
            payload/chunk-26
            payload/chunk-28
            payload/chunk-30
            payload/chunk-32
          )
          payload_blob_sha=(
            ab5390b8d8de6f4e0e784996370514e276d04cf2
            549f6e17e1c4c878aac10a05ad7e788a8dd38f53
            aa0b28a425fa0b6eb206129dd81a02a1c15a9297
            715e9da02c4e8257be033e3f2e5879124741bb80
            74db2f0497d94722770c83ac95575cb2488dabda
            a12c45a52cc2b39c751888a6d14cfb869088da91
            2581cbe39e68769551bbb26fa3807696b18305a7
            5fe6258b894ad382e1fa60d70d931a9cfa288419
            6a7934c7158301003730cfce6d6df4ee79376b81
            1bed2d1a1e1ee52a820e3c7ffb31439a3d2bdb59
            c6f58ceaea49b72600e9a76cab02b834ec00b9b9
            12a3450421060c7d17b632ef92e508540cb83d65
            c9c0b0d3ce1db1df53a0cd91b5937f68d3ebd508
            49ff07bee46c72eeed4cefceb52f188df5d956f9
            4b7fd5cfe89b26f99062da77fcfeaffee611a126
            5bce0908ec0557d8d07e93ae659cf87220091b5e
            c2dc634e63170385001a72c25234ef27204580e9
            6e4490f2e1c83aa95cdc910e5cf4a1f9ff67984b
            a9dc04e802e124f8d84ef0e5d9787854370abbd8
            8a0dcd7c22c9fcb6d4485c1c37aaadacce71a989
            d10d75d8645c811ec1468f4d59c0c83a6fdfabe4
            825936d7ee545a9d27f1807eb4d9cbb27a2def18
            73bad64ae91c01003cee7dc4789b2198cb571dda
            80743561b43f1ea6683a945bf99618361239227b
            c2b444ed550c09f1b21e5678aa2f8b7ece353a8b
          )
          test "${#payload_files[@]}" -eq "${#payload_blob_sha[@]}"
          for index in "${!payload_files[@]}"; do
            payload_file="${payload_files[$index]}"
            expected_blob="${payload_blob_sha[$index]}"
            test -f "$payload_file"
            actual_blob="$(git hash-object "$payload_file")"
            printf '%s  %s\n' "$actual_blob" "$payload_file"
            test "$actual_blob" = "$expected_blob"
          done
          cat "${payload_files[@]}" | tr -d '\r\n' | base64 --decode > echoloom-source.zip.xz
          echo "f213c567d76958479d8eb2695d45f4f2b101baaed550d244e974ec616b1704bc  echoloom-source.zip.xz" | sha256sum --check --strict
          xz --decompress --stdout echoloom-source.zip.xz > echoloom-source.zip
          echo "ad59c8bfd86be6ec6460eff0348f33961b1831a8fba3b119d9f592376f161731  echoloom-source.zip" | sha256sum --check --strict
          unzip -t echoloom-source.zip
          mkdir project
          unzip -q echoloom-source.zip -d project
          test -f project/package.json
          test -f project/package-lock.json

      - name: Setup Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Pin npm 11.9.0
        run: npm install --global npm@11.9.0

      - name: Record environment
        shell: bash
        run: |
          {
            uname -a
            node --version
            npm --version
            google-chrome --version || true
            sha256sum echoloom-source.zip echoloom-source.zip.xz
          } | tee ENVIRONMENT-CI.log

      - name: Clean npm ci
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../NPM-CI-CLEAN-PASSADA-1-CI.log

      - name: Full verify
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee ../VERIFY-CLEAN-PASSADA-1-CI.log

      - name: Package tested evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci-artifacts
          cp -f ENVIRONMENT-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f NPM-CI-CLEAN-PASSADA-1-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f VERIFY-CLEAN-PASSADA-1-CI.log ci-artifacts/ 2>/dev/null || true
          cp -f echoloom-source.zip ci-artifacts/ECHOLOOM-SOURCE-TESTED-INPUT.zip 2>/dev/null || true
          if [ -d project/release ]; then cp -a project/release ci-artifacts/release; fi
          if [ -d project/dist-static ]; then
            (cd project/dist-static && zip -X -q -r ../../ci-artifacts/ECHOLOOM-DIST-STATIC-CI.zip .)
          fi
          find ci-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > ci-artifacts/SHA256SUMS-CI.txt

      - name: Upload evidence and release outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoloom-passada1-ci-evidence
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 7
