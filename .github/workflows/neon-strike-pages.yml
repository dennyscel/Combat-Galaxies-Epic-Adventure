name: Deploy Neon Strike to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "neon-strike-eclipse/**"
      - ".github/workflows/neon-strike-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MUSIC v10 LOUD playable HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root = Path('neon-strike-eclipse/build-v10')
          # payload_1 from the first upload was corrupted. The exact original
          # chunk is now stored safely as payload_1a + payload_1b.
          targets = [
              ('payload_0.txt',  '52780834d239334cc940a5a8ad4e371f03281cf2312050eba4f70d6befe892d8'),
              ('payload_2.txt',  '55e57ae348a0b72cd8b38bae7dfacb31082c8aef08c5c2aea3c4291a686f8965'),
              ('payload_1a.txt', 'ea339fef8674ae998e27d05dad797d02224b393b75f8bba3cc7202b65d1e5c1d'),
              ('payload_1b.txt', '8284f4253b17ff2f2e1ce0c9f481b2aada710adddde356d94726b8ac184779ce'),
              ('payload_3.txt',  'de0eb239e9cfc1badb2adaf2e7971b5e25fab5f45f1fd6141537d6a2e1e86ccd'),
              ('payload_4a.txt', 'f42c439e2110d46c8d1a1b758c68ba5b964b22c53957535f78198aa7a32548bf'),
              ('payload_4b.txt', 'd34065e1a0b520ba01d42f232101dd5f7e66b26d14e1175befd68d2ef753302f'),
              ('payload_5.txt',  '3fb75615ecc37074ff999bc07ca0b2c6978a06c7af581b2439147050103bb160'),
              ('payload_6.txt',  '3c120a24d553b972ed6b2881398c6b7d2173d7d400984a361984c09b0a24fb41'),
              ('payload_7.txt',  'e8deb2d248b74763e0de7ece52d0c852cda6b426ccbe22ad0e7a794858f29d21'),
          ]

          chunks = []
          bad = []
          for name, expected in targets:
              path = root / name
              if not path.exists():
                  raise SystemExit(f'Missing payload: {path}')
              s = ''.join(path.read_text(encoding='utf-8-sig').split())
              got = hashlib.sha256(s.encode('ascii')).hexdigest()
              print(name, 'chars:', len(s), 'sha256:', got, 'OK' if got == expected else 'MISMATCH')
              if got != expected:
                  bad.append((name, got, expected))
              chunks.append(s)
          if bad:
              raise SystemExit('Payload SHA mismatch: ' + repr(bad))

          clean = ''.join(chunks)
          packed = base64.b64decode(clean, validate=True)
          html = gzip.decompress(packed)
          html_sha = hashlib.sha256(html).hexdigest()
          expected_html_sha = '9788d0bfa953bf083581e528b9e06dcd749adc3a47370ba0fd99100c600322ad'
          if html_sha != expected_html_sha:
              raise SystemExit(f'HTML SHA mismatch: {html_sha}')

          out = Path('site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_bytes(html)
          print('MUSIC v10 LOUD bytes:', len(html))
          print('MUSIC v10 LOUD SHA256:', html_sha)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
