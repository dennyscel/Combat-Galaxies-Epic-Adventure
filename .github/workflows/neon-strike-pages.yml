name: Deploy Neon Strike to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "neon-strike-eclipse/**"
      - ".github/workflows/neon-strike-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MUSIC v10 LOUD playable HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root = Path('neon-strike-eclipse/build-v10')
          # payload_1 and payload_2 were uploaded in swapped filename order.
          # The sequence below restores the original gzip+base64 stream exactly.
          order = [
              'payload_0.txt',
              'payload_2.txt',
              'payload_1.txt',
              'payload_3.txt',
              'payload_4a.txt',
              'payload_4b.txt',
              'payload_5.txt',
              'payload_6.txt',
              'payload_7.txt',
          ]

          chunks = []
          for name in order:
              path = root / name
              if not path.exists():
                  raise SystemExit(f'Missing payload: {path}')
              s = ''.join(path.read_text(encoding='utf-8-sig').split())
              chunks.append(s)
              print(name, 'chars:', len(s))

          clean = ''.join(chunks)
          packed = base64.b64decode(clean, validate=True)
          html = gzip.decompress(packed)
          html_sha = hashlib.sha256(html).hexdigest()
          expected_html_sha = '9788d0bfa953bf083581e528b9e06dcd749adc3a47370ba0fd99100c600322ad'
          if html_sha != expected_html_sha:
              raise SystemExit(f'HTML SHA mismatch: {html_sha}')

          out = Path('site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_bytes(html)
          print('MUSIC v10 LOUD bytes:', len(html))
          print('MUSIC v10 LOUD SHA256:', html_sha)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
