name: Deploy Neon Strike to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "neon-strike-eclipse/**"
      - ".github/workflows/neon-strike-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build playable HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          root = Path('neon-strike-eclipse/build-v4')
          targets = [
              ('payload_0.txt', 20000, 'c6b8d73667e00117a4b1bf8fef524ba2b7c4e34575dd46d8875c639f5d56ea2e'),
              ('payload_1.txt', 20000, '9673ffc0823e8fefc99748253c9f5c4fe301fb4adc60af904893cc10785fe9df'),
              ('payload_2.txt', 20000, '61b93919a5c2e3f82272c1ada8ace36504b4bb650d2192259488e75be9d8c2b3'),
              ('payload_3.txt', 18768, '1b7e39847ecdbd5c9452b4e3f358012c120c2d73a4db20727dfc3cf57eede436'),
          ]

          def digest(s):
              return hashlib.sha256(s.encode('ascii')).hexdigest()

          def repair(path, expected_len, target):
              s = ''.join(path.read_text(encoding='utf-8-sig').split())
              if len(s) == expected_len and digest(s) == target:
                  print(path.name, 'OK')
                  return s
              # The first upload accidentally gained one Base64 character in payloads 0/1.
              # Find that character deterministically using the known-good chunk hash.
              if len(s) == expected_len + 1:
                  for i in range(len(s)):
                      candidate = s[:i] + s[i+1:]
                      if digest(candidate) == target:
                          print(path.name, 'REPAIRED extra char at', i)
                          return candidate
              raise SystemExit(f'{path.name}: cannot repair len={len(s)} sha={digest(s)}')

          chunks = [repair(root/name, n, sha) for name,n,sha in targets]
          clean = ''.join(chunks)
          packed = base64.b64decode(clean, validate=True)
          html = gzip.decompress(packed)
          html_sha = hashlib.sha256(html).hexdigest()
          expected_html_sha = '77b56e6b43f5024ed6d39265d3edd59bd3a82b0f21b06763e1d94a926fc7dab2'
          if html_sha != expected_html_sha:
              raise SystemExit(f'HTML SHA mismatch: {html_sha}')
          out = Path('site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_bytes(html)
          print('HTML bytes:', len(html))
          print('HTML SHA256:', html_sha)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
