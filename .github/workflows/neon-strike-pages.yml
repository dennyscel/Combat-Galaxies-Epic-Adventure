name: Deploy Neon Strike to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "neon-strike-eclipse/**"
      - ".github/workflows/neon-strike-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CYCLE SAVE v11 playable HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib

          src = Path('neon-strike-eclipse/build-v11/game_v11.html.gz')
          packed = src.read_bytes()
          packed_sha = hashlib.sha256(packed).hexdigest()
          expected_packed_sha = 'd5fe1690ace0bc4942c69fe941066da1fc6c83632815adf73525823b9b73538c'
          if packed_sha != expected_packed_sha:
              raise SystemExit(f'GZIP SHA mismatch: {packed_sha}')

          html = gzip.decompress(packed)
          html_sha = hashlib.sha256(html).hexdigest()
          expected_html_sha = 'a2286dff4fc4816e80c1b780555b2e7d05738f8636c7ad13600143e53da1aa00'
          if html_sha != expected_html_sha:
              raise SystemExit(f'HTML SHA mismatch: {html_sha}')

          out = Path('site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_bytes(html)
          print('CYCLE SAVE v11 bytes:', len(html))
          print('CYCLE SAVE v11 SHA256:', html_sha)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload playable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
