name: ECHOLOOM Hostinger Final Package

on:
  push:
    branches:
      - echoloom-passada1-ci-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "true"
      ECHOLOOM_CHROMIUM_PATH: /usr/bin/google-chrome
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Download previously hash-verified source payload
        shell: bash
        run: |
          set -euxo pipefail
          gh run download 30726825840 \
            --repo "$GITHUB_REPOSITORY" \
            --name echoloom-passada1-final-ci-evidence \
            --dir prior-evidence
          test -f prior-evidence/ECHOLOOM-SOURCE-TESTED-INPUT.tar.xz
          echo "00adaa6d1093f16dcf7e2eacc0efa41708f476032094a3011e8f558026d70c76  prior-evidence/ECHOLOOM-SOURCE-TESTED-INPUT.tar.xz" \
            | sha256sum --check --strict
          mkdir project
          tar -xJf prior-evidence/ECHOLOOM-SOURCE-TESTED-INPUT.tar.xz -C project
          test -f project/package.json
          test -f project/tests/release-critical-runtime-contracts.test.mjs

      - name: Apply final release fixes
        working-directory: project
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          game_path = Path('app/GameExperience.tsx')
          source = game_path.read_text()

          old = '''  private uninstallQaBridge() {
              if (typeof window === "undefined") return;
          '''
          new = '''  private uninstallQaBridge() {
              if (import.meta.env.VITE_ECHOLOOM_QA_RUNTIME !== "1") return;
              if (typeof window === "undefined") return;
          '''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)

          old = '''    target.group.position.y = origin.y;
              target.base.copy(target.group.position);
          '''
          new = '''    target.phase = 0;
              target.strafe = 0;
              target.group.position.y = this.terrainHeight(target.group.position.x, target.group.position.z) + 3.4;
              target.base.copy(target.group.position);
          '''
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          game_path.write_text(source)

          config_path = Path('vite.static.config.mts')
          config = config_path.read_text()
          old = '''  plugins: [react()],
            base: "./",
          '''
          new = '''  plugins: [react()],
            define: {
              "import.meta.env.VITE_ECHOLOOM_QA_RUNTIME": JSON.stringify("0"),
            },
            base: "./",
          '''
          assert config.count(old) == 1, config.count(old)
          config_path.write_text(config.replace(old, new, 1))
          PY
          patch --batch --forward -p1 < ../ci/browser-cleanup.patch
          node --check scripts/browser-test-runtime.mjs
          grep -n -A6 -B2 'target.phase = 0' app/GameExperience.tsx
          sha256sum app/GameExperience.tsx vite.static.config.mts scripts/browser-test-runtime.mjs

      - name: Setup Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Pin npm and record environment
        shell: bash
        run: |
          npm install --global npm@11.9.0
          {
            uname -a
            node --version
            npm --version
            google-chrome --version || true
            sha256sum project/app/GameExperience.tsx project/vite.static.config.mts project/scripts/browser-test-runtime.mjs
          } | tee ENVIRONMENT-HOSTINGER-FINAL.log

      - name: Clean npm ci
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../NPM-CI-HOSTINGER-FINAL.log

      - name: Full verify
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee ../VERIFY-HOSTINGER-FINAL.log

      - name: Package tested source
        working-directory: project
        run: npm run package:source

      - name: Collect final deliverables
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p hostinger-final
          cp -f ENVIRONMENT-HOSTINGER-FINAL.log hostinger-final/ 2>/dev/null || true
          cp -f NPM-CI-HOSTINGER-FINAL.log hostinger-final/ 2>/dev/null || true
          cp -f VERIFY-HOSTINGER-FINAL.log hostinger-final/ 2>/dev/null || true
          if [ -d project/release ]; then cp -a project/release hostinger-final/release; fi
          if [ -d project/dist-static ]; then
            (cd project/dist-static && zip -X -q -r ../../hostinger-final/ECHOLOOM-DIST-STATIC-TESTED.zip .)
          fi
          find hostinger-final -type f -print0 | sort -z | xargs -0 sha256sum > hostinger-final/SHA256SUMS-HOSTINGER-FINAL.txt

      - name: Upload final Hostinger package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echoloom-hostinger-final
          path: hostinger-final
          if-no-files-found: error
          retention-days: 7
